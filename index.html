<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>

<!-- 侧边栏 -->

  <div class="sidebar-header">

      <span class="logo-title">重症工作站</span>

    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <button class="nav-item active" data-view="dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>病区总览</span>
    </button>
    <button class="nav-item" data-view="patient">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>患者详情</span>
    </button>
    <button class="nav-item" data-view="handover">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
      <span>交班记录</span>
    </button>
    <button class="nav-item" data-view="outcome">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>转归管理</span>
    </button>
    <button class="nav-item" data-view="literature">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>文献检索</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm" id="btnCloudSync" onclick="showCloudSyncSetup()" style="width:100%;margin-bottom:6px;justify-content:center;font-size:0.75rem;">启用云同步</button>
    <span class="footer-badge" id="syncStatus">本地运行 · 数据不上传</span>
    <div style="display:flex;gap:4px;margin-top:4px;">
      <button class="btn btn-sm" onclick="exportData()" style="flex:1;justify-content:center;font-size:0.7rem;">导出</button>
      <button class="btn btn-sm" onclick="document.getElementById(\"importFile\").click()" style="flex:1;justify-content:center;font-size:0.7rem;">导入</button>
    </div>
    <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none">
    <span class="footer-version">v2.1</span>
  </div>
</aside>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">
  <!-- 动态渲染 -->
</main>

<!-- 模态层 -->
<div class="modal-overlay" id="modalOverlay"></div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>


<script>
// 注册 Service Worker + 更新检测
if ('serviceWorker' in navigator) {
  let newVersionReady = false;

  navigator.serviceWorker.register('./sw.js').then((reg) => {
    console.log('SW registered v' + (new Date()).toISOString().slice(0,16).replace('T',' '));

    // 监听更新
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      if (!newWorker) return;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          newVersionReady = true;
          console.log('New version ready, waiting for reload');
        }
      });
    });
  }).catch((err) => {
    console.warn('SW registration failed:', err.message);
  });

  // 监听 SW 发来的消息
  navigator.serviceWorker.addEventListener('message', (event) => {
    // 更新通知
    if (event.data && event.data.type === 'update-available') {
      newVersionReady = true;
      showUpdateBanner(event.data.version);
    }
    // 分享文件接收
    if (event.data && event.data.type === 'shared-file') {
      try {
        const imported = JSON.parse(event.data.content);
        if (imported.patients && Array.isArray(imported.patients)) {
          const backupKey = 'icu_workstation_v2_backup_shared_' + new Date().toISOString().split('T')[0];
          localStorage.setItem(backupKey, localStorage.getItem('icu_workstation_v2') || '{}');
          localStorage.setItem('icu_workstation_v2', event.data.content);
          location.reload();
        }
      } catch(e) {
        console.warn('Share import failed:', e.message);
      }
    }
  });

  // 定期检查更新（每 30 分钟）
  setInterval(() => {
    if (!newVersionReady) {
      navigator.serviceWorker.getRegistration().then((reg) => {
        if (reg) reg.update();
      });
    }
  }, 30 * 60 * 1000);
}

// 显示更新横幅
function showUpdateBanner(version) {
  // 移除旧横幅
  const old = document.getElementById('updateBanner');
  if (old) old.remove();

  const banner = document.createElement('div');
  banner.id = 'updateBanner';
  banner.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a6cb5;color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.3);z-index:999;display:flex;align-items:center;gap:12px;font-family:system-ui,sans-serif;font-size:0.88rem;animation:slideUp 0.3s ease;';
  banner.innerHTML = '<span>新版本已就绪</span><button onclick="location.reload()" style="background:#fff;color:#1a6cb5;border:none;padding:6px 14px;border-radius:4px;font-weight:600;cursor:pointer;font-size:0.82rem;">立即更新</button>';
  document.body.appendChild(banner);

  // 添加动画样式
  if (!document.getElementById('updateAnimStyle')) {
    const style = document.createElement('style');
    style.id = 'updateAnimStyle';
    style.textContent = '@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
    document.head.appendChild(style);
  }
}
</script></body>
</html>
