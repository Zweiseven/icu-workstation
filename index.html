<script src="app.js"></script>





<script>
// ICU 工作站 v2.6 — 定期轮询 + 更新通知横幅
const APP_VERSION = '202605290200';

(async function bootstrap() {
  if (!('serviceWorker' in navigator)) return;
  // === 提取云盘分享数据（Cache → localStorage，防版本重载丢失）===
  try {
    const sharedCache = await caches.open('icu-shared');
    const resp = await sharedCache.match('/__shared__');
    if (resp) {
      const text = await resp.text();
      await sharedCache.delete('/__shared__');
      localStorage.setItem('_icu_shared_import', text);
    }
  } catch(e) {}
  // 清理 URL 中的 shared 标记
  if (location.search.includes('shared=1')) {
    history.replaceState(null, '', './index.html');
  }


  // === 第一道防线：版本不匹配 → 核清理 ===
  const storedVer = localStorage.getItem('_app_version');
  
  if (storedVer !== APP_VERSION) {
    console.log('Version mismatch: ' + storedVer + ' -> ' + APP_VERSION);
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const reg of regs) await reg.unregister();
    const keys = await caches.keys();
    for (const key of keys) await caches.delete(key);
    localStorage.setItem('_app_version', APP_VERSION);
    location.reload();
    return;
  }

  // === 正常注册 SW ===
  const reg = await navigator.serviceWorker.register('./sw.js');
  console.log('SW registered: ' + APP_VERSION);
  window._swReg = reg;

  // === 导入云盘分享的数据 ===
  const sharedData = localStorage.getItem('_icu_shared_import');
  if (sharedData) {
    localStorage.removeItem('_icu_shared_import');
    try {
      const imported = JSON.parse(sharedData);
      if (imported.patients && Array.isArray(imported.patients)) {
        const backupKey = 'icu_workstation_v2_backup_' + new Date().toISOString().split('T')[0];
        localStorage.setItem(backupKey, JSON.stringify(state));
        localStorage.setItem('icu_workstation_v2', sharedData);
        location.reload();
        return;
      }
    } catch(e) { console.warn('Shared import failed:', e); }
  }

  // === 检测是否有等待中的更新 ===
  if (reg.waiting && navigator.serviceWorker.controller) {
    showUpdateBanner();
  }

  // === 发现新 SW 时追踪其安装状态 ===
  reg.addEventListener('updatefound', () => {
    const newWorker = reg.installing;
    if (!newWorker) return;
    newWorker.addEventListener('statechange', () => {
      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
        showUpdateBanner();
      }
    });
  });

  // === 定期轮询更新（每 5 分钟）===
  setInterval(() => {
    reg.update().catch(() => {});
  }, 5 * 60 * 1000);

  // === 页面恢复可见时立即检查 ===
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      reg.update().catch(() => {});
    }
  });

  // === 消息监听 ===
  navigator.serviceWorker.addEventListener('message', (event) => {
    if (!event.data) return;
    // SW 激活后通知刷新
    if (event.data.type === 'sw-updated') {
      console.log('SW updated to: ' + event.data.version);
      localStorage.setItem('_app_version', APP_VERSION);
      location.reload();
    }
    // 云盘分享文件导入
    if (event.data.type === 'shared-file') {
      try {
        const imported = JSON.parse(event.data.content);
        if (imported.patients && Array.isArray(imported.patients)) {
          const backupKey = 'icu_workstation_v2_backup_' + new Date().toISOString().split('T')[0];
          localStorage.setItem(backupKey, localStorage.getItem('icu_workstation_v2') || '{}');
          localStorage.setItem('icu_workstation_v2', event.data.content);
          location.reload();
        }
      } catch(e) {}
    }
  });
})();

// === 显示更新横幅 ===
function showUpdateBanner() {
  if (document.getElementById('updateBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'updateBanner';
  banner.className = 'update-banner';
  banner.innerHTML = '<span class="update-banner-text">检测到新版本</span><button class="update-banner-btn" id="btnUpdateNow">立即更新</button><button class="update-banner-close" id="btnUpdateDismiss">\u2715</button>';
  document.body.appendChild(banner);
  document.getElementById('btnUpdateNow').onclick = skipWaitingAndReload;
  document.getElementById('btnUpdateDismiss').onclick = () => { banner.style.display = 'none'; };
}

// === 通知等待中的 SW 立即激活，然后刷新 ===
function skipWaitingAndReload() {
  navigator.serviceWorker.getRegistration().then((r) => {
    if (r && r.waiting) {
      r.waiting.postMessage({ type: 'skip-waiting' });
    }
  });
  setTimeout(() => {
    localStorage.setItem('_app_version', APP_VERSION);
    location.reload();
  }, 300);
}
// === 侧边栏汉堡菜单切换（触控优化）===
(function setupSidebarToggle() {
  var sidebar = document.getElementById('sidebar');
  var toggle = document.getElementById('sidebarToggle');
  var overlay = document.getElementById('sidebarOverlay');
  if (!sidebar || !toggle || !overlay) return;

  function open()  { sidebar.classList.add('expanded'); overlay.classList.add('active'); }
  function close() { sidebar.classList.remove('expanded'); overlay.classList.remove('active'); }
  function toggleFn(e) { e.preventDefault(); sidebar.classList.contains('expanded') ? close() : open(); }

  // 同时绑定 click 和 touchend（防止某些安卓WebView click 不触发）
  toggle.addEventListener('click', toggleFn);
  toggle.addEventListener('touchend', function(e) {
    // 只在不支持 pointer 事件的场景下用 touchend 兜底
    if (!window.PointerEvent) { toggleFn(e); }
  });
  overlay.addEventListener('click', close);
  overlay.addEventListener('touchend', function(e) {
    if (!window.PointerEvent) close();
  });

  sidebar.querySelectorAll('.nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
      if (window.innerWidth <= 900) close();
    });
  });
})();


// === 手动检查更新 ===
function checkForUpdate(e) {
  const btn = e.target;
  btn.textContent = '检查中...';
  btn.disabled = true;
  if (window._swReg) {
    window._swReg.update().then(() => {
      setTimeout(() => {
        if (window._swReg.waiting) {
          showUpdateBanner();
        }
        btn.textContent = '已是最新';
        setTimeout(() => { btn.textContent = '检查更新'; btn.disabled = false; }, 2000);
      }, 500);
    }).catch(() => {
      btn.textContent = '检查失败';
      setTimeout(() => { btn.textContent = '检查更新'; btn.disabled = false; }, 2000);
    });
  } else {
    btn.textContent = 'SW 未注册';
    setTimeout(() => { btn.textContent = '检查更新'; btn.disabled = false; }, 2000);
  }
}
</script></body>
